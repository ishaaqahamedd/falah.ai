[mypy]
plugins = sqlalchemy.ext.mypy.plugin
python_version = 3.12
strict = false
ignore_missing_imports = false
warn_return_any = false
warn_unused_ignores = true

# Third-party packages without type stubs
[mypy-pgvector.*]
ignore_missing_imports = true

[mypy-livekit.*]
ignore_missing_imports = true

[mypy-opentelemetry.*]
ignore_missing_imports = true

[mypy-slowapi.*]
ignore_missing_imports = true

[mypy-google.genai.*]
ignore_missing_imports = true

[mypy-PIL.*]
ignore_missing_imports = true

[mypy-bcrypt.*]
ignore_missing_imports = true

# Routers receive current_user.id from FastAPI DI — SQLAlchemy plugin types it as
# _UUID_RETURN | None but it is always a valid UUID for authenticated endpoints.
[mypy-app.features.sessions.router]
disable_error_code = arg-type

[mypy-app.features.personas.router]
disable_error_code = arg-type

[mypy-app.features.livekit.router]
disable_error_code = arg-type

[mypy-app.features.context.router]
disable_error_code = arg-type,union-attr

[mypy-tests.conftest]
disable_error_code = arg-type

# Services construct ORM models with plain UUID values; plugin expects _UUID_RETURN | None.
[mypy-app.features.sessions.service]
disable_error_code = arg-type,assignment

[mypy-app.features.personas.service]
disable_error_code = arg-type

[mypy-app.features.context.service]
disable_error_code = arg-type,misc

# pgvector's Vector type has no stubs; plugin can't infer embedding column type.
[mypy-app.features.context.models]
disable_error_code = misc

[mypy-app.features.personas.repository]
disable_error_code = arg-type,assignment,return-value
